<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Channel Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#14202e; --muted:#5d6b7a; --line:#d8dee5;
  --up:#0f7b6c; --down:#c0392b; --flat:#8a96a3; --accent:#1f3a5f;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --surface:#18212b; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3541;
    --up:#3cc4ae; --down:#ff7a6b; --flat:#7a8896; --accent:#8fb4e8;
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding:max(24px,env(safe-area-inset-top)) 20px max(40px,env(safe-area-inset-bottom))}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:1;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:8px 0 0}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input{font:inherit;font-family:var(--display);font-size:15px;color:var(--ink)}
button,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-family:var(--display);font-size:14px;color:var(--muted);margin-bottom:18px}
.digest{background:var(--accent);color:var(--bg);border-radius:14px;padding:22px 26px;margin-bottom:28px}
.digest h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0 0 8px;opacity:.8}
.digest p{margin:0;font-size:20px;line-height:1.45}
.digest ul{margin:8px 0 0;padding-left:20px}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:28px}
.setup h2{font-family:var(--display);margin:0 0 6px}
.setup input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:10px 0}
.setup ol{padding-left:20px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.card.changed{border-color:var(--up);box-shadow:0 0 0 2px color-mix(in srgb,var(--up) 25%,transparent)}
.ch-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.ch-head img{width:52px;height:52px;border-radius:50%;background:var(--line)}
.ch-head h3{font-family:var(--display);margin:0;font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.ch-head a{color:var(--muted);font-size:14px;text-decoration:none;font-family:var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat .n{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.stat .l{font-family:var(--display);font-size:13px;color:var(--muted)}
.d{font-family:var(--display);font-size:13px;font-weight:600}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.meta{border-top:1px solid var(--line);padding-top:12px;font-family:var(--display);font-size:14px;color:var(--muted);display:grid;gap:4px}
.meta b{color:var(--ink);font-weight:600}
.videos{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.videos li{display:flex;gap:10px;align-items:center}
.videos img{width:72px;height:40px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.videos a{color:var(--ink);text-decoration:none;font-family:var(--display);font-size:14px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.videos .v{font-family:var(--display);font-size:12px;color:var(--muted)}
.new-tag{font-family:var(--display);font-size:11px;font-weight:700;background:var(--up);color:var(--bg);border-radius:4px;padding:1px 6px;margin-right:6px}
.err{color:var(--down);font-family:var(--display)}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.vbtn{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;cursor:pointer;border-radius:8px;padding:4px}
.vbtn:hover{background:var(--bg)} .vbtn:focus-visible{outline:2px solid var(--accent)}
.vbtn .t{font-family:var(--display);font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vbtn .v{display:block;font-family:var(--display);font-size:12px;color:var(--muted)}
.more{margin-top:10px;font-size:13px;padding:6px 12px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,16,24,.65)}
.m-body{padding:22px 24px 28px}
.m-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.m-head img{width:160px;border-radius:8px;flex:none}
.m-head h2{font-family:var(--display);font-size:22px;line-height:1.2;margin:0}
.m-head .sub{margin:6px 0}
.m-head>button{margin-left:auto;flex:none}
.m-body a{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:12px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .n{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.tile .l{font-family:var(--display);font-size:12px;color:var(--muted)}
.m-body h3,.m-body h4{font-family:var(--display);margin:22px 0 6px}
.chart{width:100%;height:auto}
.bar{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-family:var(--display);font-size:13px;margin:4px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent)}
.bar b{text-align:right}
.m-body input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin:8px 0}
@media (max-width:560px){.m-head{flex-wrap:wrap}.m-head img{width:100%}}
.digest button.link{all:unset;cursor:pointer;text-decoration:underline;font-weight:600}
.digest button.link:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.digest h2 button.link{font-weight:400;font-size:13px;margin-left:12px}
.digest .tot{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--display);font-size:20px;font-weight:600;margin:6px 0 12px}
.digest .boom{background:rgba(255,255,255,.18);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:17px}
.digest li{margin:4px 0;font-size:16px}
.spark{margin:0 0 14px}.spark .l{font-family:var(--display);font-size:12px;color:var(--muted)}
.meta summary{cursor:pointer;font-weight:600;color:var(--ink)}
.metabody{display:grid;gap:4px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sec{border-top:1px solid var(--line);padding:10px 0}
.sec>summary{font-family:var(--display);font-weight:600;cursor:pointer}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.digest ul.feed{list-style:none;padding:0;margin:10px 0 0}
.digest .when{display:block;font-family:var(--display);font-size:13px;opacity:.85}
.trend{padding:0;margin-bottom:28px}
.trend>summary{padding:18px 22px;font-family:var(--display);font-weight:600;font-size:18px;cursor:pointer}
#trendbody{padding:0 22px 22px}
.trendctl{display:grid;grid-template-columns:150px 1fr 130px 160px auto;gap:8px;margin:10px 0}
.trendctl input{margin:0}
ul.tl{list-style:none;padding:0;display:grid;gap:12px}
ul.tl a{color:var(--ink);font-family:var(--display);font-weight:600;text-decoration:none}
ul.tl .v{font-family:var(--display);font-size:13px;color:var(--muted)}
@media (max-width:700px){.trendctl{grid-template-columns:1fr 1fr}.trendctl input{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Channel Pulse</h1>
      <p class="sub">Your channels, one screen. It only checks when you press Check now.</p>
    </div>
    <div class="controls">
      <button id="refresh" class="primary">Check now</button>
    </div>
  </header>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="setup"></div>
  <div id="digest"></div>
  <details class="trend card" id="trend"><summary>Trend research: what is working in your niche</summary><div id="trendbody"></div></details>
  <div class="grid" id="grid"></div>
</div>

<dialog id="modal" aria-labelledby="mtitle"><div class="m-body" id="mbody"></div></dialog>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ====== EDIT HERE: your channels (handles without the @) ====== */
const HANDLES = ["promethix1", "VOIDMELODIES-o4x", "stickybutstory", "weirdhustlewins", "lumen_leaf"];
/* ============================================================== */

const DEFAULT_KEY = "AIzaSyCEklcgTJxDElNgj-F0WsXI8N5dMOyQmXU";
const API = "https://www.googleapis.com/youtube/v3";
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const $ = id => document.getElementById(id);
let timer = null, countdownTimer = null, nextAt = 0, busy = false;

const fmt = n => n == null ? "Hidden" : Number(n).toLocaleString("en-US");
const short = n => {
  if (n == null) return "Hidden";
  n = Number(n);
  if (n >= 1e6) return (n/1e6).toFixed(2).replace(/\.?0+$/,"") + "M";
  if (n >= 1e4) return (n/1e3).toFixed(1).replace(/\.0$/,"") + "K";
  return n.toLocaleString("en-US");
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = ts => {
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " days ago";
};
function delta(n, label){
  if (n == null || isNaN(n)) return `<span class="d flat">–</span>`;
  if (n === 0) return `<span class="d flat">no change${label ? " " + label : ""}</span>`;
  const cls = n > 0 ? "up" : "down";
  return `<span class="d ${cls}">${n > 0 ? "▲ +" : "▼ "}${fmt(n)}${label ? " " + label : ""}</span>`;
}

async function api(path, params){
  const key = LS.get("yt_key", "") || DEFAULT_KEY;
  const url = new URL(API + path);
  Object.entries({...params, key}).forEach(([k,v]) => url.searchParams.set(k, v));
  const r = await fetch(url.toString());
  const j = await r.json();
  if (!r.ok) throw new Error(j.error?.message || ("HTTP " + r.status));
  return j;
}

async function resolveIds(){
  const cache = LS.get("yt_ids", {});
  for (const h of HANDLES){
    if (cache[h]) continue;
    const j = await api("/channels", { part: "id", forHandle: "@" + h });
    if (!j.items?.length) throw new Error("Channel not found: @" + h);
    cache[h] = j.items[0].id;
  }
  LS.set("yt_ids", cache);
  return HANDLES.map(h => cache[h]);
}

async function fetchAll(){
  const ids = await resolveIds();
  const ch = await api("/channels", { part: "snippet,statistics,contentDetails", id: ids.join(",") });
  const byId = Object.fromEntries(ch.items.map(i => [i.id, i]));
  const out = [];
  for (const id of ids){
    const c = byId[id];
    if (!c) continue;
    const uploads = c.contentDetails.relatedPlaylists.uploads;
    let vids = [];
    try{
      const pl = await api("/playlistItems", { part: "snippet,contentDetails", playlistId: uploads, maxResults: 15 });
      const vidIds = pl.items.map(i => i.contentDetails.videoId).join(",");
      if (vidIds){
        const vs = await api("/videos", { part: "snippet,statistics", id: vidIds });
        vids = vs.items.map(v => ({
          id: v.id, title: v.snippet.title, published: v.snippet.publishedAt,
          thumb: v.snippet.thumbnails?.default?.url || "",
          views: Number(v.statistics.viewCount || 0),
          likes: v.statistics.likeCount != null ? Number(v.statistics.likeCount) : null,
          comments: v.statistics.commentCount != null ? Number(v.statistics.commentCount) : null
        })).sort((a,b) => new Date(b.published) - new Date(a.published));
      }
    }catch(e){ /* uploads list can fail for empty channels */ }
    const s = c.statistics;
    out.push({
      id, handle: c.snippet.customUrl || "", title: c.snippet.title,
      avatar: c.snippet.thumbnails?.default?.url || "",
      subs: s.hiddenSubscriberCount ? null : Number(s.subscriberCount),
      views: Number(s.viewCount), videos: Number(s.videoCount), recent: vids
    });
  }
  return out;
}

/* history: { channelId: [ {t, subs, views, videos, ids:[...]} ] } */
function pickBaseline(hist, ageMs){
  const target = Date.now() - ageMs;
  let best = null;
  for (const h of hist){ if (h.t <= target) best = h; }
  return best;
}
function dayDelta(hist, cur, ageMs, field){
  const b = pickBaseline(hist, ageMs);
  if (!b || b[field] == null || cur[field] == null) return null;
  return cur[field] - b[field];
}

function analyse(cur, hist){
  const prev = hist.length ? hist[hist.length - 1] : null;
  const prevIds = new Set(prev?.ids || []);
  const newVids = prev ? cur.recent.filter(v => !prevIds.has(v.id)) : [];
  const d = {
    subs: prev && prev.subs != null && cur.subs != null ? cur.subs - prev.subs : null,
    views: prev ? cur.views - prev.views : null,
    videos: prev ? cur.videos - prev.videos : null,
    subs24: dayDelta(hist, cur, 864e5, "subs"),
    views24: dayDelta(hist, cur, 864e5, "views"),
    subs7: dayDelta(hist, cur, 6048e5, "subs"),
    views7: dayDelta(hist, cur, 6048e5, "views"),
    sinceT: prev ? prev.t : null,
    newVids
  };
  d.prevVV = prev?.vv || {};
  d.changed = !!(prev && (d.subs || d.views || d.videos || newVids.length));
  const now = Date.now();
  const last30 = cur.recent.filter(v => now - new Date(v.published) < 30 * 864e5);
  d.uploads30 = last30.length;
  const rv = cur.recent.slice(0, 10);
  d.avgViews = rv.length ? Math.round(rv.reduce((a,v) => a + v.views, 0) / rv.length) : null;
  d.top = [...rv].sort((a,b) => b.views - a.views)[0] || null;
  d.lastUpload = cur.recent[0]?.published || null;
  return d;
}

function render(results){
  LAST = results;
  results.forEach(({cur, d}) => { CHANNELS[cur.id] = {cur, d}; cur.recent.forEach(v => VIDEOS[v.id] = {...v, channelId: cur.id}); });
  const grid = $("grid");
  grid.innerHTML = results.map(({cur, d}) => {
    const url = cur.handle ? `https://www.youtube.com/${cur.handle}` : `https://www.youtube.com/channel/${cur.id}`;
    const newIds = new Set(d.newVids.map(v => v.id));
    return `<article class="card ${d.changed ? "changed" : ""}">
      <div class="ch-head">
        <img src="${esc(cur.avatar)}" alt="" width="52" height="52">
        <div><h3>${esc(cur.title)}</h3><a href="${esc(url)}" target="_blank" rel="noopener">${esc(cur.handle || "Open channel")}</a>${cur.studio ? ' <span class="new-tag" style="background:var(--accent)">Studio numbers</span>' : ""}</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">${short(cur.subs)}</div><div class="l">Subscribers</div>${delta(d.subs)}</div>
        <div class="stat"><div class="n">${short(cur.views)}</div><div class="l">Total views</div>${delta(d.views)}</div>
        <div class="stat"><div class="n">${fmt(cur.videos)}</div><div class="l">Videos</div>${delta(d.videos)}</div>
      </div>
      ${sparkHtml(cur)}
      <details class="meta"><summary>More stats</summary><div class="metabody">
        <div>Last 24 h: <b>${d.subs24 == null ? "collecting data" : (d.subs24 >= 0 ? "+" : "") + fmt(d.subs24) + " subs, " + (d.views24 >= 0 ? "+" : "") + fmt(d.views24) + " views"}</b></div>
        <div>Last 7 days: <b>${d.subs7 == null ? "collecting data" : (d.subs7 >= 0 ? "+" : "") + fmt(d.subs7) + " subs, " + (d.views7 >= 0 ? "+" : "") + fmt(d.views7) + " views"}</b></div>
        <div>Uploads in last 30 days: <b>${d.uploads30}</b>${d.lastUpload ? " · last upload " + ago(new Date(d.lastUpload).getTime()) : ""}</div>
        <div>Average views, last ${Math.min(10, cur.recent.length)} videos: <b>${d.avgViews == null ? "–" : fmt(d.avgViews)}</b></div>
        ${d.top ? `<div>Top recent: <b>${esc(d.top.title.length > 46 ? d.top.title.slice(0,46) + "…" : d.top.title)}</b> (${short(d.top.views)})</div>` : ""}
      </div></details>
      <ul class="videos">
        ${(expanded.has(cur.id) ? cur.recent : cur.recent.slice(0, 4)).map(v => `<li><button class="vbtn" data-vid="${esc(v.id)}">
          <img src="${esc(v.thumb)}" alt="" loading="lazy">
          <span><span class="t">${newIds.has(v.id) ? '<span class="new-tag">NEW</span>' : ""}${esc(v.title)}</span>
          <span class="v">${vline(v)}</span></span>
        </button></li>`).join("")}
      </ul>
      ${cur.recent.length > 4 ? `<button class="more" data-more="${cur.id}">${expanded.has(cur.id) ? "Show fewer" : "Show all " + cur.recent.length}</button>` : ""}
    </article>`;
  }).join("");
}

function notify(results){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  const bits = results.filter(r => r.d.changed).map(({cur, d}) => {
    const p = [];
    if (d.newVids.length) p.push(d.newVids.length + " new video");
    if (d.subs) p.push((d.subs > 0 ? "+" : "") + d.subs + " subs");
    if (d.views) p.push((d.views > 0 ? "+" : "") + fmt(d.views) + " views");
    return cur.title + ": " + p.join(", ");
  });
  if (bits.length){
    try{ new Notification("Channel Pulse", { body: bits.join("\n") }); }catch(e){}
  }
}

function showSetup(msg){
  $("setup").innerHTML = `<section class="setup">
    <h2>Add your YouTube API key</h2>
    <p>${msg ? `<span class="err">${esc(msg)}</span>` : "The page needs a free YouTube Data API v3 key to read public channel numbers."}</p>
    <ol>
      <li>Open Google Cloud Console and create a project.</li>
      <li>Enable “YouTube Data API v3”.</li>
      <li>Create an API key under Credentials and restrict it to your site address.</li>
    </ol>
    <input id="keyInput" type="password" placeholder="Paste API key" autocomplete="off" aria-label="YouTube API key">
    <button class="primary" id="saveKey">Save key and check</button>
  </section>`;
  $("saveKey").onclick = () => {
    const v = $("keyInput").value.trim();
    if (!v) return;
    LS.set("yt_key", v);
    $("setup").innerHTML = "";
    check();
  };
}

async function check(){
  if (busy) return;
  if (!LS.get("yt_key", "") && !DEFAULT_KEY){ showSetup(); $("status").textContent = "Waiting for API key."; return; }
  busy = true;
  $("refresh").disabled = true;
  $("status").textContent = "Checking channels…";
  try{
    const data = await fetchAll();
    applyHighWater(data);
    const hist = LS.get("yt_hist", {});
    const results = [];
    let firstRun = true;
    for (const cur of data){
      const h = hist[cur.id] || [];
      if (h.length) firstRun = false;
      results.push({ cur, d: analyse(cur, h) });
    }
    recordEvents(results);
    render(results);
    renderDigest();
    LS.set("yt_cache", {t: Date.now(), results});
    if (!firstRun) notify(results);
    /* save snapshot; keep ~30 days, thinning to one per 10 min */
    const cutoff = Date.now() - 30 * 864e5;
    for (const {cur} of results){
      let h = (hist[cur.id] || []).filter(x => x.t > cutoff);
      const snap = { t: Date.now(), subs: cur.subs, views: cur.views, videos: cur.videos, ids: cur.recent.map(v => v.id), vv: Object.fromEntries(cur.recent.map(v => [v.id, v.views])) };
      if (h.length > 1 && snap.t - h[h.length - 1].t < 18e5) h[h.length - 1] = {...snap, t: h[h.length - 1].t}; else h.push(snap);
      if (h.length > 1){ delete h[h.length - 2].ids; delete h[h.length - 2].vv; }
      hist[cur.id] = h;
    }
    LS.set("yt_hist", hist);
    const vh = LS.get("yt_vh", {}), nowT = Date.now(), vcut = nowT - 14 * 864e5;
    for (const {cur} of results) for (const v of cur.recent){
      const a = (vh[v.id] || []).filter(p => p[0] > vcut), pt = [nowT, v.views, v.likes || 0, v.comments || 0];
      if (a.length > 1 && nowT - a[a.length - 1][0] < 18e5) a[a.length - 1] = [a[a.length - 1][0], pt[1], pt[2], pt[3]]; else a.push(pt);
      vh[v.id] = a;
    }
    LS.set("yt_vh", vh);
    if (document.visibilityState === "visible") LS.set("yt_visit", snapState(results));
    $("setup").innerHTML = "";
    $("status").textContent = "Last checked " + new Date().toLocaleTimeString() + ".";
  }catch(e){
    const bad = /API key|keyInvalid|referer|forbidden|quota/i.test(e.message);
    const blocked = /failed to fetch|networkerror|load failed/i.test(e.message);
    $("status").innerHTML = `<span class="err">${blocked
      ? "The browser could not reach YouTube. Open this page from your hosted site address (not a preview), and turn off ad blockers or VPN for it."
      : esc(e.message)}</span>`;
    if (bad) showSetup(e.message);
  }finally{
    busy = false;
    $("refresh").disabled = false;
    schedule();
  }
}

async function aapi(tok, p){
  const u = new URL("https://youtubeanalytics.googleapis.com/v2/reports");
  Object.entries({ids: "channel==MINE", ...p}).forEach(([k, x]) => u.searchParams.set(k, x));
  const r = await fetch(u.toString(), {headers: {Authorization: "Bearer " + tok}});
  const j = await r.json();
  if (!r.ok){ const e = new Error(j.error?.message || ("HTTP " + r.status)); e.status = r.status; throw e; }
  return j;
}
const cols = j => { const o = {}; (j.rows?.[0] || []).forEach((x, i) => o[j.columnHeaders[i].name] = x); return o; };

function connectHtml(){

function connect(){
  const inp = $("cid"); if (inp && inp.value.trim()) LS.set("yt_client", inp.value.trim());
  const say = m => { const e = $("smsg"); if (e) e.textContent = m; };
  if (!clientId()) return say("Paste your OAuth client ID first.");
  if (!window.google?.accounts?.oauth2) return say("Google sign-in did not load. Turn off ad blockers and reload.");
  const want = CHANNELS[CURV.channelId].cur.title;
  google.accounts.oauth2.initTokenClient({
    client_id: clientId(), scope: SCOPES,
    error_callback: e => say("Sign-in was cancelled or blocked (" + (e.type || "error") + ")."),
    callback: async r => {
      if (r.error) return say(r.error);
      try{
        const j = await (await fetch("https://www.googleapis.com/youtube/v3/channels?part=id&mine=true", {headers: {Authorization: "Bearer " + r.access_token}})).json();
        const cid = j.items?.[0]?.id;
        if (!cid || !CHANNELS[cid]) return say("That account's channel is not one of your three. Sign in again and pick " + want + ".");
        const all = LS.get("yt_tokens", {}); all[cid] = {token: r.access_token, exp: Date.now() + r.expires_in * 1000}; LS.set("yt_tokens", all);
        if (cid !== CURV.channelId) return say("You signed in to " + CHANNELS[cid].cur.title + ". Sign in again and pick " + want + ".");
        loadStudio();
      }catch(e){ say(e.message); }
    }
  }).requestAccessToken({prompt: "select_account"});
}

function retChart(rows){

async function studioOverlay(out){

function applyHighWater(out){
  const hw = LS.get("yt_hw", {}), vh = LS.get("yt_vh", {}), bv = SESSION_BASE?.v || {}, bc = SESSION_BASE?.c || {};

function lineChart(pts, h = 120){

  const X = x => 44 + (x - x0) / xr * 546, Y = y => h - 24 - (y - y0) / yr * (h - 44);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join("");
  const lab = x => new Date(x).toLocaleString(undefined, x1 - x0 > 1728e5 ? {month: "short", day: "numeric"} : {hour: "numeric", minute: "2-digit"});

}

  return `<svg class="chart" viewBox="0 0 600 ${h}" role="img" aria-label="Bar chart">${bars}${svgT(40,16,"end",short(m))}${svgT(40,h-24,"end","0")}${svgT(44,h-6,"start",labs[0])}${svgT(590,h-6,"end",labs[labs.length-1])}</svg>`;
}

async function loadStudio(){

  const today = pacificToday(), pub = v.published.slice(0, 10), d28 = new Date(Date.now() - 28 * 864e5).toISOString().slice(0, 10);
  const b = {startDate: pub, endDate: today, filters: "video==" + v.id}, q = x => aapi(tok, {...b, ...x});
  const rs = await Promise.allSettled([
    q({metrics: "views,estimatedMinutesWatched,averageViewDuration,averageViewPercentage,shares,subscribersGained,subscribersLost"}),
    q({dimensions: "elapsedVideoTimeRatio", metrics: "audienceWatchRatio,relativeRetentionPerformance"}),
    q({dimensions: "insightTrafficSourceType", metrics: "views", sort: "-views"}),
    q({startDate: pub > d28 ? pub : d28, dimensions: "day", metrics: "views,estimatedMinutesWatched", sort: "day"}),
    q({dimensions: "country", metrics: "views", sort: "-views", maxResults: 6}),

  }

  if (ret) h += sec("Audience retention", ret.length > 2 ? retChart(ret) : `<p class="sub">Not enough viewers yet for a retention curve.</p>`, true);
  const day = ok(3);
  if (day) h += sec("Last 28 days, day by day", day.length > 1 ? `<div class="two"><div><h4>Views</h4>${barChart(day.map(r => r[1]), day.map(r => r[0]))}</div><div><h4>Watch time (hours)</h4>${barChart(day.map(r => r[2] / 60), day.map(r => r[0]), n => n.toFixed(1))}</div></div>` : `<p class="sub">Not enough days of data yet.</p>`, true);

}

/* ---------- activity feed ---------- */
function recordEvents(results){
  const last = LS.get("yt_last", null), ev = LS.get("yt_events", []), now = Date.now(), seen = {};
  for (const {cur: c} of results) for (const v of c.recent){
    const o = last?.v?.[v.id], n = [v.views, v.likes || 0, v.comments || 0];
    const m = o ? n.map((x, i) => Math.max(x, o[i])) : n;
    seen[v.id] = m;
    if (!o) continue;
    const dv = m[0] - o[0], dl = m[1] - o[1], dc = m[2] - o[2];
    if (dv > 0 || dl > 0 || dc > 0) ev.push({t: now, from: last.t, id: v.id, title: v.title, ch: c.title, dv, dl, dc});
  }
  LS.set("yt_events", ev.slice(-300));
  LS.set("yt_last", {t: now, v: {...(last?.v || {}), ...seen}});
}
function renderDigest(){
  const ev = LS.get("yt_events", []), box = $("digest");
  const tm = t => { const d = new Date(t); return (new Date().toDateString() === d.toDateString() ? "" : d.toLocaleDateString(undefined, {month: "short", day: "numeric"}) + ", ") + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit", second: "2-digit"}); };
  const when = e => e.t - e.from > 6e5 ? "between " + tm(e.from) + " and " + tm(e.t) : tm(e.t);
  const pl = (n, w) => `+${n} ${w}${n === 1 ? "" : "s"}`;
  const rows = ev.slice(-25).reverse();
  box.innerHTML = `<div class="digest"><h2>Recent activity: videos that just got views, likes or comments</h2>
    ${rows.length ? `<ul class="feed">${rows.map(e => `<li><span class="when">${when(e)}</span><button class="link" data-vid="${esc(e.id)}">${esc(e.title)}</button> <small>(${esc(e.ch)})</small> <b>${[e.dv && pl(e.dv, "view"), e.dl && pl(e.dl, "like"), e.dc && pl(e.dc, "comment")].filter(Boolean).join(", ")}</b></li>`).join("")}</ul>`
      : `<p>Waiting for changes. Keep this page open and new views, likes and comments will be listed here.</p>`}
    <p style="font-size:13px;opacity:.85;margin:10px 0 0">The time is when this page noticed the change. YouTube does not publish the exact moment of each view, and its public counts can lag. A range means the page was closed in between.</p></div>`;
}

  out.innerHTML = `<p class="status">Searching…</p>`;
  try{
    const sp = {part: "snippet", type: "video", q: kw, order: "viewCount", publishedAfter: new Date(Date.now() - days * 864e5).toISOString(), maxResults: 30, relevanceLanguage: "en"};
    if ($("tfmt").value === "short") sp.videoDuration = "short";
    const ids = (await api("/search", sp)).items.map(i => i.id.videoId).filter(Boolean);
    if (!ids.length){ out.innerHTML = `<p class="sub">No videos found. Try other keywords or a longer window.</p>`; return; }
    const vs = (await api("/videos", {part: "snippet,statistics,contentDetails", id: ids.join(",")})).items;
    const cs = (await api("/channels", {part: "statistics", id: [...new Set(vs.map(v => v.snippet.channelId))].join(",")})).items;
    const subs = Object.fromEntries(cs.map(c => [c.id, c.statistics.hiddenSubscriberCount ? null : Number(c.statistics.subscriberCount)]));
    const L = vs.map(v => {
      const st = v.statistics, views = Number(st.viewCount || 0), age = Math.max(1, (Date.now() - new Date(v.snippet.publishedAt)) / 36e5), sb = subs[v.snippet.channelId];
      return {id: v.id, title: v.snippet.title, ch: v.snippet.channelTitle, tags: v.snippet.tags || [], views, vph: views / age, lr: views ? Number(st.likeCount || 0) / views * 100 : 0, cr: views ? Number(st.commentCount || 0) / views * 100 : 0,
        secs: isoSecs(v.contentDetails.duration), subs: sb, ratio: sb ? views / sb : null, hour: new Date(v.snippet.publishedAt).getHours()};
    }).sort((a, b) => b.vph - a.vph);
    const n = L.length, pct = f => Math.round(L.filter(f).length / n * 100), avg = k => L.reduce((a, x) => a + x[k], 0) / n;
    const tc = {}; L.forEach(x => new Set(x.tags.map(t => t.toLowerCase().trim())).forEach(t => { if (t) tc[t] = (tc[t] || 0) + 1; }));
    const tags = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 15);
    const secs = L.map(x => x.secs).sort((a, b) => a - b), hc = {}; L.forEach(x => hc[x.hour] = (hc[x.hour] || 0) + 1);
    const hrs = Object.entries(hc).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => new Date(2000, 0, 1, +e[0]).toLocaleTimeString([], {hour: "numeric"}));
    const known = L.filter(x => x.ratio != null), top = L.slice(0, 10);
    const tk = [
      `${pct(x => x.secs <= 180)}% of these videos are 3 minutes or shorter. Median length: ${mmss(secs[Math.floor(n / 2)])}.`,
      known.length ? `${known.filter(x => x.ratio >= 5).length} of ${known.length} have views at least 5× the channel's subscribers. That means YouTube is showing them beyond the creator's own audience.` : "",
      known.length ? `${top.filter(x => x.subs != null && x.subs < 1000).length} of the top 10 come from channels under 1,000 subscribers, so small channels can win here.` : "",
      `Titles: ${pct(x => /\d/.test(x.title))}% contain a number, ${pct(x => x.title.includes("?"))}% ask a question, ${pct(x => x.title.includes("#"))}% use hashtags. Average length ${Math.round(L.reduce((a, x) => a + x.title.length, 0) / n)} characters.`,
      `Average like rate ${avg("lr").toFixed(1)}% and comment rate ${avg("cr").toFixed(2)}% of views.`,
      `Most common publish hours (your local time): ${hrs.join(", ")}.`,
      `${pct(x => x.tags.length > 0)}% of the videos have tags, so tags are only one signal.`
    ].filter(Boolean);
    out.innerHTML = `<h4>What is working (${n} videos, last ${days} days, ranked by views per hour)</h4><ul>${tk.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <p class="sub">These are patterns in what is getting views now, not YouTube's secret rules.</p>
      <h4>Top tags <button class="more" data-copytags="${esc(tags.map(t => t[0]).join(", "))}">Copy tags</button></h4>${tags.length ? barList(tags, r => r[0], n) : `<p class="sub">These videos use no tags.</p>`}
      <h4>Views per hour, top 10</h4>${barChart(top.map(x => Math.round(x.vph)), top.map((x, i) => "#" + (i + 1) + " " + x.title.slice(0, 28)))}
      <h4>Top videos</h4><ul class="tl">${top.map((x, i) => `<li><a href="https://www.youtube.com/watch?v=${esc(x.id)}" target="_blank" rel="noopener">${i + 1}. ${esc(x.title)}</a>
        <div class="v">${esc(x.ch)}${x.subs != null ? " (" + short(x.subs) + " subs)" : ""} · ${short(x.views)} views · ${x.vph.toFixed(1)}/hr · ${x.lr.toFixed(1)}% likes · ${mmss(x.secs)}${x.ratio != null ? " · " + x.ratio.toFixed(1) + "× subs" : ""}</div>
        ${x.tags.length ? `<div class="v">Tags: ${x.tags.slice(0, 6).map(esc).join(", ")}</div>` : ""}</li>`).join("")}</ul>`;
  }catch(e){ out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

$("refresh").onclick = check;

initTrend();
{ const c = LS.get("yt_cache", null);
  if (c && c.results){ render(c.results); renderDigest(); $("status").textContent = "Last checked " + new Date(c.t).toLocaleString() + ". Press Check now to update."; }
  else { renderDigest(); $("status").textContent = "Press Check now to load your channels."; } }
</script>
